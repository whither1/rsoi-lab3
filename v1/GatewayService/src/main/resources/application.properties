server.port=8080
server.servlet.context-path=/

management.endpoints.web.base-path=/manage
management.endpoint.health.show-details=always

app.services.flight=http://flight-service:8060
app.services.ticket=http://ticket-service:8070
app.services.bonus=http://bonus-service:8050

# Circuit Breaker (операции чтения)
app.circuit-breaker.threshold=3
app.circuit-breaker.reset-timeout=10000

# RabbitMQ (очередь отката бонусов при возврате билета)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
